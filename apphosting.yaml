# Firebase App Hosting configuration.
# https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Brevo list that receives waitlist signups (Contacts → Lists → ID).
  - variable: BREVO_WAITLIST_LIST_ID
    value: "0" # TODO(fs): replace with the list ID
    availability:
      - RUNTIME
  # Set with: npx firebase-tools apphosting:secrets:set BREVO_API_KEY --project spamlyze
  - variable: BREVO_API_KEY
    secret: BREVO_API_KEY
    availability:
      - RUNTIME
