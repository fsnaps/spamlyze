# Firebase App Hosting configuration.
# https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Brevo list that receives waitlist signups (Contacts → Lists → ID).
  - variable: BREVO_WAITLIST_LIST_ID
    value: "18"
    availability:
      - RUNTIME
  # Set with: npx firebase-tools apphosting:secrets:set BREVO_API_KEY --project spamlyze
  # Brevo list for Monitoring (subscription) interest.
  - variable: BREVO_MONITORING_LIST_ID
    value: "19"
    availability:
      - RUNTIME
  - variable: BREVO_API_KEY
    secret: BREVO_API_KEY
    availability:
      - RUNTIME
  # Quick Check (free plan)
  - variable: CLAUDE_MODEL
    value: "claude-haiku-5-5"
    availability:
      - RUNTIME
  - variable: QUICK_CHECK_PER_IP_DAILY
    value: "3"
    availability:
      - RUNTIME
  - variable: QUICK_CHECK_GLOBAL_DAILY
    value: "200"
    availability:
      - RUNTIME
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability:
      - RUNTIME
  # reCAPTCHA v3 keys from https://www.google.com/recaptcha/admin (domain: spamlyze.com)
  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    value: "6LckWBkuAAAAAEs-4yFZN6LqDRKvA1aWOch_Lp7f"
    availability:
      - BUILD
      - RUNTIME
  - variable: RECAPTCHA_SECRET_KEY
    secret: RECAPTCHA_SECRET_KEY
    availability:
      - RUNTIME
  # Deep Report (paid). "true" shows the checkout on the homepage and under Quick Checks.
  - variable: DEEP_REPORT_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  # Priced by site size: up to 100 pages (small) or up to 500 pages (large), counted
  # from the sitemap at checkout.
  - variable: DEEP_REPORT_SMALL_PRICE_CENTS
    value: "1900"
    availability:
      - BUILD
      - RUNTIME
  - variable: DEEP_REPORT_PRICE_CENTS
    value: "3900"
    availability:
      - BUILD
      - RUNTIME
  # Time-boxed Deep Report promo. Checked on every request: it starts and stops on its own,
  # no redeploy needed. PROMO_ENDS_AT is exclusive. Leave PROMO_PERCENT_OFF at "0" to disable.
  - variable: PROMO_LABEL
    value: "Black Friday"
    availability:
      - BUILD
      - RUNTIME
  - variable: PROMO_PERCENT_OFF
    value: "25"
    availability:
      - BUILD
      - RUNTIME
  - variable: PROMO_STARTS_AT
    value: "2026-11-16T00:00:00+01:00"
    availability:
      - BUILD
      - RUNTIME
  - variable: PROMO_ENDS_AT
    value: "2026-12-01T00:00:00+01:00"
    availability:
      - BUILD
      - RUNTIME
  - variable: DEEP_REPORT_MODEL
    value: "claude-opus-5-5"
    availability:
      - RUNTIME
  # Set with: npx firebase-tools apphosting:secrets:set STRIPE_SECRET_KEY --project spamlyze
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME
  # Signing secret of the Stripe webhook endpoint https://spamlyze.com/api/stripe/webhook
  # Set with: npx firebase-tools apphosting:secrets:set STRIPE_WEBHOOK_SECRET --project spamlyze
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - RUNTIME
  # Google accounts allowed on /admin (comma-separated). Set with:
  # npx firebase-tools apphosting:secrets:set ADMIN_EMAILS --project spamlyze
  - variable: ADMIN_EMAILS
    secret: ADMIN_EMAILS
    availability:
      - RUNTIME
  # Google Analytics 4 (loaded only after cookie consent)
  - variable: NEXT_PUBLIC_GA_ID
    value: "G-Y9NXSF3VW0"
    availability:
      - BUILD
      - RUNTIME
  # Google Search Console import (OAuth client "Spamlyze web", redirect https://spamlyze.com/api/gsc/callback)
  - variable: GOOGLE_OAUTH_CLIENT_ID
    value: "68146420478-6ncjp5mkbl7mfstsgucs68ksuq92cbmh.apps.googleusercontent.com"
    availability:
      - RUNTIME
  # Set with: npx firebase-tools apphosting:secrets:set GOOGLE_OAUTH_CLIENT_SECRET --project spamlyze
  - variable: GOOGLE_OAUTH_CLIENT_SECRET
    secret: GOOGLE_OAUTH_CLIENT_SECRET
    availability:
      - RUNTIME
